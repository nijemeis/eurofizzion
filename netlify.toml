[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (and its credits) when a push changes nothing the site is built from,
  # e.g. README or docs edits. Exit code 0 = skip, 1 = build. Always builds when there is no
  # previous build to compare with (first deploy, cleared cache).
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- content src public scripts netlify package.json package-lock.json astro.config.mjs netlify.toml"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

# Fingerprinted build assets never change; cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/flags/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Daily news for the news bar from the feeds in content/news-feeds.json (edited in the CMS).
# Commits content/news.json only when it changed,
# so Netlify only rebuilds on days with new stories. Run it by hand from the Actions tab too.
name: Update news

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch stories
        run: node scripts/fetch-news.ts
      - name: Commit if changed
        run: |
          if git diff --quiet -- content/news.json; then
            echo "No new stories."
            exit 0
          fi
          git config user.name "eurofizzion-news"
          git config user.email "sing@eurofizzion.com"
          git add content/news.json
          git commit -m "News: update from feeds"
          git pull --rebase origin main
          git push origin HEAD:main
